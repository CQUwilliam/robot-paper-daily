name: Run Arxiv Papers Daily

permissions:
  contents: write

# Controls when the workflow will run
on:
  workflow_dispatch:
  schedule:
    # arXiv normally publishes on weekdays. Avoid the top of the hour because
    # scheduled GitHub Actions runs can be delayed or dropped during peak load.
    - cron: "17 9 * * 1-5"
      timezone: "Asia/Shanghai"

concurrency:
  group: robot-paper-daily
  cancel-in-progress: false

env:
  GITHUB_USER_NAME: github-actions[bot]
  GITHUB_USER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  
  
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    name: update
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Python Env
        uses: actions/setup-python@v5
        with:
          python-version: 3.11     

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install arxiv requests beautifulsoup4 friendly-traceback
          
      - name: Run daily arxiv 
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}  # 注入密钥到环境变量
          LLM_PROMPT: ${{ vars.LLM_PROMPT }}
        run: |
          python paper_daily.py
          python create_index.py
          
      - name: Commit and push updates
        run: |
          git config user.name "${GITHUB_USER_NAME}"
          git config user.email "${GITHUB_USER_EMAIL}"
          git add README.md arxiv_cs_ro_papers_final.json index.html
          if git diff --cached --quiet; then
            echo "No paper updates to commit"
            exit 0
          fi
          git commit -m "Github Action Automatic Update Robot Papers"
          git push origin HEAD:main
